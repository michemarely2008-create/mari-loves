<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy of Love</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Georgia,serif;
}
canvas{
position:fixed;
top:0;
left:0;
}
.instructions{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
color:white;
opacity:0.7;
}
.credits{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
color:white;
font-family:'Pacifico',cursive;
}
</style>
</head>

<body>

<div class="instructions">Te Amo Muchote</div>
<div class="credits">Fernando</div>

<canvas id="canvas"></canvas>

<audio id="bg-music" loop autoplay>
<source src="https://github.com/Gon-p/G-/raw/refs/heads/main/adore%20-%20_did%20i%20tell%20u%20that%20i%20miss%20u_%20(lyric%20video).m4a" type="audio/mpeg">
</audio>

<script type="module">

import * as THREE from "https://cdn.skypack.dev/three@0.132.2";
import { OrbitControls } from "https://cdn.skypack.dev/three@0.132.2/examples/jsm/controls/OrbitControls.js";

const canvas = document.getElementById("canvas");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
100
);

camera.position.set(0,0,8);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({canvas});
renderer.setSize(window.innerWidth, window.innerHeight);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

const geometry = new THREE.TorusKnotGeometry(2,0.6,200,32);
const material = new THREE.PointsMaterial({
color:0xff3088,
size:0.03
});

const heart = new THREE.Points(geometry,material);
scene.add(heart);

// -------- TEXTO CENTRAL --------

const textCanvas = document.createElement("canvas");
textCanvas.width = 512;
textCanvas.height = 128;

const context = textCanvas.getContext("2d");
context.font = "Bold 60px Pacifico";
context.textAlign = "center";
context.textBaseline = "middle";

const gradient = context.createLinearGradient(0,0,512,0);
gradient.addColorStop(0,"#ff6030");
gradient.addColorStop(0.5,"#ffffff");
gradient.addColorStop(1,"#0949f0");

context.fillStyle = gradient;
context.shadowColor = "#ffffff";
context.shadowBlur = 25;

// 👇 NOMBRE CAMBIADO AQUÍ 👇
context.fillText("👑Mari👑", textCanvas.width/2, textCanvas.height/2);

const texture = new THREE.CanvasTexture(textCanvas);
const spriteMaterial = new THREE.SpriteMaterial({
map:texture,
transparent:true
});
const sprite = new THREE.Sprite(spriteMaterial);
sprite.scale.set(4,1,1);
scene.add(sprite);

// -------- ANIMACIÓN --------

function animate(){
controls.update();
renderer.render(scene,camera);
requestAnimationFrame(animate);
}
animate();

// -------- RESPONSIVE --------

window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

// -------- AUDIO --------

const audio = document.getElementById("bg-music");
audio.volume = 0.4;

document.addEventListener("click",()=>{
audio.play();
},{once:true});

</script>

</body>
</html>
